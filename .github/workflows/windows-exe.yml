name: Build Windows portable release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.16.0
      - name: Run tests
        run: python -m unittest discover -p "test_*.py" -v
      - name: Build desktop application (portable folder)
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ForeverMarketTracker --icon assets/app_icon.ico --add-data "assets/app_icon.png;assets" --version-file build/windows_version_info.txt --collect-all PySide6.QtCharts --collect-all tzdata app.py
      - name: Build optional collector (portable folder)
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ForeverMarketCollector --collect-all tzdata collector.py
      - name: Verify both executable builds
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ForeverMarketTracker/ForeverMarketTracker.exe')) { throw 'Missing desktop EXE' }
          if (!(Test-Path 'dist/ForeverMarketCollector/ForeverMarketCollector.exe')) { throw 'Missing collector EXE' }
      - name: Prepare distribution and SHA-256 manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse dist/ForeverMarketTracker release/ForeverMarketTracker
          Copy-Item -Recurse dist/ForeverMarketCollector release/ForeverMarketCollector
          Copy-Item build/RELEASE_README.txt release/README.txt
          $paths = @('release/ForeverMarketTracker/ForeverMarketTracker.exe', 'release/ForeverMarketCollector/ForeverMarketCollector.exe')
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            "$hash  $path"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Compress-Archive -Path release/* -DestinationPath ForeverMarketTracker-Windows-v1.2.4f-Portable.zip -CompressionLevel Optimal
      - name: Upload portable Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: ForeverMarketTracker-Windows-v1.2.4f-Portable
          path: ForeverMarketTracker-Windows-v1.2.4f-Portable.zip
          if-no-files-found: error
          retention-days: 30
